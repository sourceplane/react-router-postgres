apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: RR-1
  title: "The spec"
spec:
  goal: The react-router-postgres epic — declaration, doc set and task contracts — is on main, with the repository's intent, CI and shared tooling
  affects:
    - specs/**
    - tasks/**
    - intent.yaml
    - .github/workflows/ci.yml
    - .gitignore
    - .vscode/**
    - package.json
    - pnpm-workspace.yaml
    - pnpm-lock.yaml
    - turbo.json
    - tooling/eslint/**
    - tooling/tsconfig/**
    - tooling/wire/**
    - tooling/migrations/**
  doneWhen:
    - epic.yaml, README, design, implementation plan, risks and status are merged
    - the five task contracts exist
    - ci.yml's plan job is green while the workspace is ws_CHANGE_ME
  gates: []
